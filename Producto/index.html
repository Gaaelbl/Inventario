<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario</title>
</head>
<body>

    <h2>Inventario</h2>

    <label for="codigo">Código:</label>
    <input type="text" id="codigo"><br><br>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre"><br><br>

    <label for="cantidad">Cantidad:</label>
    <input type="number" id="cantidad" min="0" step="1"><br><br>

    <label for="costo">Costo:</label>
    <input type="number" id="costo" min="0" step="0.01"><br><br>

    <button onclick="agregarProducto()">Agregar</button>
    <button onclick="listarProductos()">Listar</button>
    <button onclick="listarInverso()">Listar inverso</button>
    <button onclick="eliminarProducto()">Eliminar</button>
    <button onclick="limpiar()">Limpiar</button>

    <div id="resultado"></div>

    <script src="producto.js"></script>
    <script src="inventario.js"></script>
    <script src="app.js"></script>

</body>
</html>
